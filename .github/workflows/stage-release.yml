name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to stage, for example 0.1.2
        required: true
        type: string

concurrency:
  group: stage-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build immutable release tarballs
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Stage releases only from main; received $GITHUB_REF" >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate supply-chain policy
        run: node scripts/check-supply-chain-security.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up release-compatible Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify repository
        run: bun run verify
      - name: Revalidate immutable source tree
        run: |
          node scripts/check-supply-chain-security.mjs
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Verification modified tracked repository files" >&2
            git status --short --untracked-files=no >&2
            git diff -- >&2
            exit 1
          fi
      - name: Prepare release tarballs
        run: bun run release:prepare
      - name: Upload immutable release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ inputs.version }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage:
    name: Submit tarballs for npm 2FA approval
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_PROVENANCE: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Set up release-compatible Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Download immutable release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ inputs.version }}-${{ github.sha }}
          path: release-artifacts
      - name: Verify release manifest and checksums
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(
            readFileSync("release-artifacts/release-manifest.json", "utf8"),
          );
          const expectedNames = [
            "comlink-worker-pool",
            "comlink-worker-pool-react",
          ];
          if (manifest.schemaVersion !== 1) {
            throw new Error(`Unsupported manifest schema ${manifest.schemaVersion}`);
          }
          if (manifest.repository !== process.env.GITHUB_REPOSITORY) {
            throw new Error(
              `Manifest repository ${manifest.repository} does not match ${process.env.GITHUB_REPOSITORY}`,
            );
          }
          if (manifest.commit !== process.env.GITHUB_SHA) {
            throw new Error(
              `Manifest commit ${manifest.commit} does not match ${process.env.GITHUB_SHA}`,
            );
          }
          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `Manifest version ${manifest.version} does not match ${process.env.RELEASE_VERSION}`,
            );
          }
          const names = manifest.packages.map(({ name }) => name).sort();
          if (JSON.stringify(names) !== JSON.stringify(expectedNames)) {
            throw new Error(`Unexpected package set: ${names.join(", ")}`);
          }
          for (const packageInfo of manifest.packages) {
            if (packageInfo.version !== manifest.version) {
              throw new Error(
                `${packageInfo.name} has version ${packageInfo.version}, expected ${manifest.version}`,
              );
            }
            if (!/^[0-9a-f]{64}$/.test(packageInfo.sha256)) {
              throw new Error(`${packageInfo.name} has an invalid SHA-256 digest`);
            }
          }
          console.log(
            `Validated ${manifest.packages
              .map(({ name, version }) => `${name}@${version}`)
              .join(", ")} from ${manifest.commit}`,
          );
          NODE
          (
            cd release-artifacts
            sha256sum --check SHA256SUMS
          )
      - name: Stage packages through npm trusted publishing
        run: |
          node <<'NODE' > /tmp/release-tarballs
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(
            readFileSync("release-artifacts/release-manifest.json", "utf8"),
          );
          for (const packageInfo of manifest.packages) {
            console.log(packageInfo.filename);
          }
          NODE
          while IFS= read -r filename; do
            echo "Staging release-artifacts/$filename"
            npm stage publish "release-artifacts/$filename" \
              --registry=https://registry.npmjs.org/
          done < /tmp/release-tarballs
      - name: Write approval instructions
        run: |
          {
            echo "## npm release staged"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- The packages are **not public yet**."
            echo "- Download each staged tarball from npm, compare it with the SHA-256 values in the workflow artifact, inspect its contents and provenance, then approve it with 2FA."
            echo "- After both packages are public, run the **Finalize npm release** workflow with this version and commit."
          } >> "$GITHUB_STEP_SUMMARY"
