name: Normalize security lockfile

on:
  push:
    branches:
      - agent/harden-shai-hulud-supply-chain

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove stale dependency trust and this one-time workflow
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("bun.lock")
          contents = path.read_text()
          trusted_block = '''  "trustedDependencies": [
              "@biomejs/biome",
            ],
          '''
          if contents.count(trusted_block) != 1:
              raise SystemExit("Expected exactly one stale trustedDependencies block")
          path.write_text(contents.replace(trusted_block, ""))
          PY
          git rm .github/workflows/normalize-security-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "security: remove lockfile dependency trust"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
