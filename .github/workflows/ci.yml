name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  audit-export:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-audit-findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create tracked-file snapshot
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null --files-from=- -czf repository-audit-snapshot.tar.gz
          git ls-files > repository-audit-files.txt
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-snapshot
          path: |
            repository-audit-snapshot.tar.gz
            repository-audit-files.txt
          retention-days: 1

  deep-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-audit-findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run repository analysis tools
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit-reports
          run_audit() {
            local name="$1"
            shift
            set +e
            "$@" >"audit-reports/${name}.stdout.txt" 2>"audit-reports/${name}.stderr.txt"
            local status=$?
            set -e
            printf '%s\n' "$status" >"audit-reports/${name}.status.txt"
          }
          set -e
          run_audit knip bunx knip --reporter json
          run_audit oxlint bunx oxlint --format json .
          run_audit coverage bun test --coverage
          run_audit audit bun audit --json
          run_audit outdated bun outdated --json
          run_audit duplicates bunx jscpd --min-lines 8 --min-tokens 60 --reporters json,console --output audit-reports/jscpd .
          run_audit sherif bunx sherif
          find audit-reports -maxdepth 3 -type f -print -exec wc -c {} \; > audit-reports/manifest.txt
      - name: Upload repository audit reports
        uses: actions/upload-artifact@v4
        with:
          name: repository-deep-audit-reports
          path: audit-reports
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint all workspaces
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck all workspaces
        run: bun run typecheck

  version-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Materialize pending Changesets
        run: bun run version
      - name: Validate generated version files
        run: bun run lint && git diff --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Test comlink-worker-pool
        run: bun run --filter comlink-worker-pool test
      - name: Test comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Build comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react build
      - name: Check scheduler and bundle budgets
        run: bun run benchmark:runtime && bun run benchmark:bundle
      - name: Build playground
        run: bun run playground:build
      - name: Validate packed packages and consumer imports
        run: bun run test:packages

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser engines and system dependencies
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Build publishable packages
        run: bun run build
      - name: Test real workers in Chromium, Firefox, and WebKit
        run: bun run test:browser
