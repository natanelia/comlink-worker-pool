name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint all workspaces
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck all workspaces
        run: bun run typecheck

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests with coverage
        run: bun run test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit

  version-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Materialize pending Changesets
        run: bun run version
      - name: Validate publishable package versions
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const packagePaths = [
            "packages/comlink-worker-pool/package.json",
            "packages/comlink-worker-pool-react/package.json",
          ];
          const packages = packagePaths.map((path) =>
            JSON.parse(readFileSync(path, "utf8")),
          );
          const versions = new Set(packages.map(({ version }) => version));
          if (versions.size !== 1) {
            throw new Error(
              `Publishable packages must share one version; found ${[
                ...versions,
              ].join(", ")}`,
            );
          }
          console.log(
            `Validated lockstep release ${packages
              .map(({ name, version }) => `${name}@${version}`)
              .join(", ")}`,
          );
          NODE
      - name: Validate generated version files
        run: bun run lint && git diff --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Test comlink-worker-pool
        run: bun run --filter comlink-worker-pool test
      - name: Test comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Build comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react build
      - name: Check scheduler and bundle budgets
        run: bun run benchmark:runtime && bun run benchmark:bundle
      - name: Build playground
        run: bun run playground:build
      - name: Validate packed packages and consumer imports
        run: bun run test:packages

  node-18-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build publishable packages
        run: bun run build
      - name: Validate packages under Node.js 18
        run: bun run test:packages

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser engines and system dependencies
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Build publishable packages
        run: bun run build
      - name: Test real workers in Chromium, Firefox, and WebKit
        run: bun run test:browser
