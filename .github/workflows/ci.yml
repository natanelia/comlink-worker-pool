name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up release-compatible Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate supply-chain policy
        run: node scripts/check-supply-chain-security.mjs
      - name: Validate staged-publishing toolchain
        run: |
          node <<'NODE'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
            throw new Error(`Node 22.14.0 or newer is required; found ${process.version}`);
          }
          const { execFileSync } = require("node:child_process");
          const npmVersion = execFileSync("npm", ["--version"], {
            encoding: "utf8",
          }).trim();
          const [npmMajor, npmMinor] = npmVersion.split(".").map(Number);
          if (npmMajor < 11 || (npmMajor === 11 && npmMinor < 15)) {
            throw new Error(`npm 11.15.0 or newer is required; found ${npmVersion}`);
          }
          console.log(`Validated Node ${process.version} and npm ${npmVersion}`);
          NODE

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint all workspaces
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck all workspaces
        run: bun run typecheck

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run unit tests with coverage
        run: bun run test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: bun run audit

  version-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Materialize pending Changesets
        run: bun run version
      - name: Validate publishable package versions
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const packagePaths = [
            "packages/comlink-worker-pool/package.json",
            "packages/comlink-worker-pool-react/package.json",
          ];
          const packages = packagePaths.map((path) =>
            JSON.parse(readFileSync(path, "utf8")),
          );
          const versions = new Set(packages.map(({ version }) => version));
          if (versions.size !== 1) {
            throw new Error(
              `Publishable packages must share one version; found ${[
                ...versions,
              ].join(", ")}`,
            );
          }
          console.log(
            `Validated lockstep release ${packages
              .map(({ name, version }) => `${name}@${version}`)
              .join(", ")}`,
          );
          NODE
      - name: Validate generated version files
        run: bun run lint && git diff --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Test comlink-worker-pool
        run: bun run --filter comlink-worker-pool test
      - name: Test comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build comlink-worker-pool
        run: bun run --filter comlink-worker-pool build
      - name: Build comlink-worker-pool-react
        run: bun run --filter comlink-worker-pool-react build
      - name: Check scheduler and bundle budgets
        run: bun run benchmark:runtime && bun run benchmark:bundle
      - name: Build playground
        run: bun run playground:build
      - name: Validate packed packages and consumer imports
        run: bun run test:packages

  node-18-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 18
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build publishable packages
        run: bun run build
      - name: Validate packages under Node.js 18
        run: bun run test:packages

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser engines and system dependencies
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Build publishable packages
        run: bun run build
      - name: Test real workers in Chromium, Firefox, and WebKit
        run: bun run test:browser
